name: Recover hidden Yoyo danger branch

on:
  push:
    paths:
      - '.github/workflows/recover-yoyo-danger-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recover danger branch pages and referenced assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.parse import urlencode
          from urllib.error import HTTPError,URLError
          import json,re,html,time,csv,hashlib

          ROOT=Path('research/yoyo-danger-branch'); ROOT.mkdir(parents=True,exist_ok=True)
          UA='Mozilla/5.0 Roomz-preservation (+https://github.com/dereksparks1982/The-Roomz-Game-2007)'
          targets=[]
          for host in ('theroomz.yoyo.pl','www.theroomz.yoyo.pl'):
            for p in ('danger','danger/','danger/map.htm','danger/map.htm/','danger/map.html','danger/map.html/','danger/index.htm','danger/index.html','roomz.htm'):
              targets.append(f'http://{host}/{p}')

          def get(u,tries=4,timeout=35):
            last=None
            for n in range(tries):
              try:
                with urlopen(Request(u,headers={'User-Agent':UA}),timeout=timeout) as r:return r.read(),r.geturl()
              except HTTPError as e:
                last=e
                if e.code in (429, 500, 502, 503, 504):
                  time.sleep(1.4*(n+1)); continue
                raise
              except (URLError,TimeoutError) as e:
                last=e;time.sleep(1.4*(n+1))
            raise RuntimeError(str(last))

          hits=[]; failures=[]; refs=[]; files=[]
          for target in targets:
            try:
              q='https://web.archive.org/cdx/search/cdx?'+urlencode({'url':target,'matchType':'exact','output':'json','fl':'timestamp,original,statuscode,mimetype,digest,length','filter':'statuscode:200','from':'2006','to':'2022'})
              b,_=get(q,tries=3)
              data=json.loads(b)
              if not data:continue
              hdr=data[0]
              for row in data[1:]:hits.append(dict(zip(hdr,row)))
            except Exception as e:failures.append(['cdx',target,repr(e)])

          seen=set(); uniq=[]
          for r in hits:
            k=r.get('digest') or (r['timestamp'],r['original'])
            if k in seen:continue
            seen.add(k);uniq.append(r)

          for r in uniq:
            try:
              arc=f"https://web.archive.org/web/{r['timestamp']}id_/{r['original']}"
              b,final=get(arc,tries=3)
              ext='.bin'
              low=r['original'].lower()
              if 'htm' in low or r.get('mimetype','').startswith('text/html'):ext='.html'
              elif low.endswith('.txt'):ext='.txt'
              elif low.endswith('.swf'):ext='.swf'
              name=f"{r['timestamp']}__{hashlib.sha256(b).hexdigest()[:12]}{ext}"
              (ROOT/name).write_bytes(b)
              s=b.decode('utf-8','replace')
              for m in re.finditer(r'(?i)(?:href|src|movie|value)\s*=\s*["\']?([^"\' >]+)',s):
                x=html.unescape(m.group(1))
                if x not in [z[3] for z in refs]:refs.append([r['timestamp'],r['original'],name,x])
              files.append([r['timestamp'],r['original'],r.get('mimetype',''),len(b),hashlib.sha256(b).hexdigest(),name,final])
            except Exception as e:failures.append(['replay',r['original'],repr(e)])

          def tsv(n,h,d):
            with (ROOT/n).open('w',newline='',encoding='utf-8') as f:
              w=csv.writer(f,delimiter='\t',lineterminator='\n');w.writerow(h);w.writerows(d)
          tsv('captures.tsv',['timestamp','original','mimetype','bytes','sha256','file','final_url'],files)
          tsv('references.tsv',['timestamp','original','file','reference'],refs)
          tsv('failures.tsv',['stage','target','error'],failures)
          summary=['# Yoyo danger branch recovery','',f'- Unique archive bodies: {len(uniq)}',f'- Replayed objects: {len(files)}',f'- References extracted: {len(refs)}',f'- Failures: {len(failures)}','','## Captures','']
          summary += [f"- {r[0]} `{r[1]}` {r[2]} {r[3]} bytes -> `{r[5]}`" for r in files] or ['- None.']
          summary += ['','## References','']+[f'- `{r[3]}`' for r in refs] if refs else ['','## References','','- None.']
          (ROOT/'RESULT.md').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          print('\n'.join(summary))
          PY
      - name: Commit recovered danger branch
        shell: bash
        run: |
          git config user.name "Derek Sparks"
          git config user.email "dereksparks1982@gmail.com"
          git add research/yoyo-danger-branch
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover hidden Yoyo danger branch through 2022"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
