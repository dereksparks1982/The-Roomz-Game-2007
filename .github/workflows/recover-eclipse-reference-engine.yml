name: Recover Roomz Eclipse reference engine

on:
  push:
    paths:
      - '.github/workflows/recover-eclipse-reference-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch surviving Roomz Eclipse mirror and inventory its engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          import hashlib,zlib,re,csv,time

          ROOT=Path('research/reference-engines/roomz-eclipse');ROOT.mkdir(parents=True,exist_ok=True)
          REC=ROOT/'recovered';REC.mkdir(exist_ok=True)
          UA='Mozilla/5.0 Roomz-preservation (+https://github.com/dereksparks1982/The-Roomz-Game-2007)'
          urls=['https://www.jeuxclic.com/jeux/55fc413893d02.swf','http://www.jeuxclic.com/jeux/55fc413893d02.swf']
          rows=[];fails=[]
          for u in urls:
            try:
              req=Request(u,headers={'User-Agent':UA,'Referer':'https://www.jeuxclic.com/jeux.php?id=2243089'})
              with urlopen(req,timeout=35) as r:b=r.read();final=r.geturl()
              sha=hashlib.sha256(b).hexdigest();valid=len(b)>100 and b[:3] in (b'FWS',b'CWS',b'ZWS')
              fn=''
              toks=[]
              if valid:
                fn=f'{sha[:12]}__roomz-eclipse.swf';(REC/fn).write_bytes(b)
                raw=b
                if b[:3]==b'CWS':raw=b'FWS'+b[3:8]+zlib.decompress(b[8:])
                strings=[m.group().decode('latin1','replace') for m in re.finditer(rb'[ -~]{4,}',raw)]
                toks=[]
                for s in strings:
                  if re.search(r'(?i)room\d+|check|load|quick|pass|eclipse|interface|intro|\.swf|\.txt',s):
                    if s not in toks:toks.append(s)
              rows.append([u,len(b),sha,valid,fn,' | '.join(toks[:300]),final])
            except Exception as e:fails.append([u,repr(e)])
          with (ROOT/'results.tsv').open('w',newline='',encoding='utf-8') as f:
            w=csv.writer(f,delimiter='\t',lineterminator='\n');w.writerow(['url','bytes','sha256','valid_swf','file','interesting_strings','final_url']);w.writerows(rows)
          with (ROOT/'failures.tsv').open('w',newline='',encoding='utf-8') as f:
            w=csv.writer(f,delimiter='\t',lineterminator='\n');w.writerow(['url','error']);w.writerows(fails)
          good=[r for r in rows if r[3]]
          summary=['# The Roomz: Eclipse reference engine','',f'- Valid SWFs: {len(good)}',f'- Failures: {len(fails)}','','## SWF','']
          summary += [f'- `{r[0]}` — {r[1]} bytes, sha256 `{r[2]}`, file `{r[4]}`' for r in good] or ['- None.']
          summary += ['','## Interesting embedded strings','']
          if good:
            for s in good[0][5].split(' | '):summary.append(f'- `{s}`')
          (ROOT/'RESULT.md').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          print('\n'.join(summary[:500]))
          PY
      - name: Commit reference engine evidence
        shell: bash
        run: |
          git config user.name "Derek Sparks"
          git config user.email "dereksparks1982@gmail.com"
          git add research/reference-engines/roomz-eclipse
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover Roomz Eclipse as engine reference"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
