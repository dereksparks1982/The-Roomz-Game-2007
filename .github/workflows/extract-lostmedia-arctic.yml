name: Recover Lost Media Roomz links via Arctic Shift

on:
  push:
    paths:
      - '.github/workflows/extract-lostmedia-arctic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch archived Reddit comment tree and extract links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import json,re,csv,html,time

          ROOT=Path('research/external-leads/lostmedia-arctic'); ROOT.mkdir(parents=True,exist_ok=True)
          UA='Mozilla/5.0 Roomz-preservation (+https://github.com/dereksparks1982/The-Roomz-Game-2007)'
          urls=[
            'https://arctic-shift.photon-reddit.com/api/comments/tree?link_id=t3_z11xux&limit=9999',
            'https://arctic-shift.photon-reddit.com/api/comments/search?link_id=z11xux&limit=100&sort=asc',
          ]
          data=None; used=''; errs=[]
          for u in urls:
            try:
              with urlopen(Request(u,headers={'User-Agent':UA,'Accept':'application/json'}),timeout=45) as r: raw=r.read()
              d=json.loads(raw)
              if d:
                data=d;used=u;(ROOT/'raw.json').write_bytes(raw);break
            except Exception as e:errs.append([u,repr(e)])

          comments=[]
          def walk(x):
            if isinstance(x,dict):
              if isinstance(x.get('body'),str): comments.append([x.get('id',''),x.get('author',''),x.get('score',''),x['body']])
              d=x.get('data')
              if isinstance(d,dict) and isinstance(d.get('body'),str): comments.append([d.get('id',''),d.get('author',''),d.get('score',''),d['body']])
              for v in x.values(): walk(v)
            elif isinstance(x,list):
              for v in x:walk(v)
          if data is not None:walk(data)
          dc=[];seen=set()
          for r in comments:
            k=r[3]
            if k not in seen:seen.add(k);dc.append(r)

          md=re.compile(r'\[([^\]]+)\]\((https?://[^)]+)\)')
          bare=re.compile(r'https?://[^\s<>\]]+')
          links=[]
          for cid,author,score,body in dc:
            for m in md.finditer(body): links.append([m.group(1),html.unescape(m.group(2)),cid,author,str(score),body])
            # Bare URLs not already represented by markdown.
            md_urls={m.group(2) for m in md.finditer(body)}
            for m in bare.finditer(body):
              u=m.group(0).rstrip(').,;\'"')
              if u not in md_urls: links.append(['bare',html.unescape(u),cid,author,str(score),body])
          out=[];seen=set()
          for r in links:
            if r[1] not in seen:seen.add(r[1]);out.append(r)

          target=[]
          for r in out:
            s=(r[0]+' '+r[1]+' '+r[5]).lower()
            if any(k in s for k in ('archive domain','flashkit','roomz','yoyo','dreamward','walkthrough','flashpoint')):target.append(r)

          def tsv(n,h,rows):
            with (ROOT/n).open('w',newline='',encoding='utf-8') as f:
              w=csv.writer(f,delimiter='\t',lineterminator='\n');w.writerow(h);w.writerows(rows)
          tsv('comments.tsv',['id','author','score','body'],dc)
          tsv('links.tsv',['label','url','comment_id','author','score','body'],out)
          tsv('high-value-links.tsv',['label','url','comment_id','author','score','body'],target)
          tsv('failures.tsv',['url','error'],errs)
          summary=['# Lost Media Roomz link recovery via Arctic Shift','',f'- Source used: {used or "none"}',f'- Comments recovered: {len(dc)}',f'- Outbound URLs: {len(out)}',f'- High-value URLs: {len(target)}',f'- Endpoint failures: {len(errs)}','', '## High-value links','']
          summary += [f'- **{r[0]}**: {r[1]}' for r in target] or ['- None recovered.']
          summary += ['', '## All links','']+[f'- **{r[0]}**: {r[1]}' for r in out]
          (ROOT/'RESULT.md').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          print('\n'.join(summary))
          PY
      - name: Commit recovered links safely
        shell: bash
        run: |
          git config user.name "Derek Sparks"
          git config user.email "dereksparks1982@gmail.com"
          git add research/external-leads/lostmedia-arctic
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover Lost Media Roomz source links via Arctic Shift"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
