name: Fast DreamWard sibling Roomz probe

on:
  push:
    paths:
      - '.github/workflows/fast-dreamward-sibling-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Replay missing siblings at known DreamWard capture times
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          import hashlib,csv,time,re

          ROOT=Path('research/dreamward-sibling-probe');ROOT.mkdir(parents=True,exist_ok=True)
          REC=ROOT/'recovered';REC.mkdir(exist_ok=True)
          UA='Mozilla/5.0 Roomz-preservation (+https://github.com/dereksparks1982/The-Roomz-Game-2007)'
          names=['check.swf','sciemka.swf','about.swf','rules.swf','solutions.swf','tescik.swf','ile.txt','bonus.txt','hof.htm']
          roots=['http://dreamwardgames.com/theroomz/','http://dreamward.home.pl/theroomz/']
          times=['20150125014523','20150125020014','20160602063809','20160602073428','20160602081019','20160805142136']

          def get(u,tries=2):
            last=None
            for n in range(tries):
              try:
                with urlopen(Request(u,headers={'User-Agent':UA}),timeout=30) as r:return r.read(),r.geturl(),dict(r.headers)
              except HTTPError as e:
                last=e
                if e.code not in (429,500,502,503,504):break
                time.sleep(n+1)
              except (URLError,TimeoutError) as e:last=e;time.sleep(n+1)
            raise RuntimeError(repr(last))

          def valid(name,b):
            if name.lower().endswith('.swf'):return len(b)>100 and b[:3] in (b'FWS',b'CWS',b'ZWS')
            if name.lower().endswith('.txt'):return b and b'<html' not in b[:200].lower()
            return len(b)>50

          rows=[];fails=[];seen=set()
          existing={}
          for p in Path('originals').rglob('*'):
            if p.is_file():
              try:existing[hashlib.sha256(p.read_bytes()).hexdigest()]=str(p)
              except:pass
          for root in roots:
            for name in names:
              for ts in times:
                orig=root+name
                arc=f'https://web.archive.org/web/{ts}id_/{orig}'
                try:
                  b,final,h=get(arc)
                  sha=hashlib.sha256(b).hexdigest()
                  key=(sha,name.lower())
                  if key in seen:continue
                  seen.add(key)
                  if not valid(name,b):
                    rows.append([name,ts,orig,len(b),sha,final,'invalid',''])
                    continue
                  status='NEW' if sha not in existing else 'already:'+existing[sha]
                  fn=f'{ts}__{sha[:12]}__{name}'
                  (REC/fn).write_bytes(b)
                  rows.append([name,ts,orig,len(b),sha,final,status,fn])
                except Exception as e:fails.append([name,ts,orig,repr(e)])

          with (ROOT/'results.tsv').open('w',newline='',encoding='utf-8') as f:
            w=csv.writer(f,delimiter='\t',lineterminator='\n');w.writerow(['name','requested_timestamp','original','bytes','sha256','final_url','status','file']);w.writerows(rows)
          with (ROOT/'failures.tsv').open('w',newline='',encoding='utf-8') as f:
            w=csv.writer(f,delimiter='\t',lineterminator='\n');w.writerow(['name','timestamp','original','error']);w.writerows(fails)
          good=[r for r in rows if r[6].startswith(('NEW','already:'))]
          summary=['# Fast DreamWard sibling probe','',f'- Valid objects: {len(good)}',f'- New objects: {sum(r[6]=="NEW" for r in good)}',f'- Failures: {len(fails)}','','## Valid objects','']
          summary += [f'- **{r[6]}** `{r[0]}` requested {r[1]} -> {r[3]} bytes sha256 `{r[4]}` final `{r[5]}`' for r in good] or ['- None.']
          (ROOT/'RESULT.md').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          print('\n'.join(summary))
          PY
      - name: Promote new files and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,shutil
          root=Path('research/dreamward-sibling-probe');out=Path('originals/recovered/runtime-data');out.mkdir(parents=True,exist_ok=True)
          p=root/'results.tsv'
          if p.exists():
            with p.open(encoding='utf-8') as f:
              for r in csv.DictReader(f,delimiter='\t'):
                if r.get('status')=='NEW' and r.get('file'):
                  src=root/'recovered'/r['file'];dst=out/r['file']
                  if src.exists() and not dst.exists():shutil.copy2(src,dst)
          PY
          git config user.name "Derek Sparks"
          git config user.email "dereksparks1981982@gmail.com"
          git add research/dreamward-sibling-probe originals/recovered/runtime-data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe missing DreamWard Roomz sibling files"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
