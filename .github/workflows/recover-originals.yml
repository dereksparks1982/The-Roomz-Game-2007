name: Import recovered originals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-originals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-originals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify recovered files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p originals/recovered/dreamwardgames
          mkdir -p originals/recovered/dreamwardgames-site
          mkdir -p originals/recovered/yoyo
          mkdir -p originals/recovered/demo

          fetch_verified() {
            local out="$1" expected="$2"; shift 2
            local ok=0 tmp
            tmp="${out}.tmp"
            mkdir -p "$(dirname "$out")"
            for url in "$@"; do
              rm -f "$tmp"
              if curl -fL --retry 4 --retry-delay 2 --connect-timeout 30 --max-time 180 \
                   -A 'The-Roomz-preservation/1.0' "$url" -o "$tmp"; then
                got="$(sha256sum "$tmp" | awk '{print $1}')"
                if [[ "$got" == "$expected" ]]; then
                  mv "$tmp" "$out"
                  printf '%s\t%s\t%s\n' "$expected" "$out" "$url" >> originals/PROVENANCE.tsv
                  ok=1
                  break
                fi
                echo "Hash mismatch for $url: got $got expected $expected" >&2
              fi
            done
            rm -f "$tmp"
            if [[ "$ok" -ne 1 ]]; then
              echo "FAILED to recover verified bytes for $out" >&2
              exit 1
            fi
          }

          printf 'sha256\tpath\tsource_url\n' > originals/PROVENANCE.tsv

          fetch_verified originals/recovered/dreamwardgames/frame.swf \
            ee32de2a31bafbad87e70cfd45d148e88b3f2ee1a4a50427f097249bdae601de \
            'https://web.archive.org/web/20160602081019id_/http://dreamwardgames.com/theroomz/frame.swf'

          fetch_verified originals/recovered/dreamwardgames/interface.swf \
            ce0585181bf6c7071f95271e9fd3c6882321408fbc9a4199a4de3ff6c0a253e5 \
            'https://web.archive.org/web/20160805142136id_/http://dreamwardgames.com/theroomz/interface.swf'

          fetch_verified originals/recovered/dreamwardgames/Intro.swf \
            b6f0e021fab208effa7d066671b1584f726d069bcb66dc0e65afdadb6b3992ea \
            'https://web.archive.org/web/20160602073428id_/http://dreamwardgames.com/theroomz/Intro.swf'

          fetch_verified originals/recovered/dreamwardgames/loadRoom.swf \
            b3710c350c39b56a941a687412b724877e0206a60e6ec5d8973431b68708df0d \
            'https://web.archive.org/web/20160602063809id_/http://dreamwardgames.com/theroomz/loadRoom.swf'

          fetch_verified originals/recovered/dreamwardgames/RoomzMain.swf \
            55478cbaa7e32dcbfdf90d5766d9d0f8eaaf12969bcfd2057d8c51fda900e51c \
            'https://web.archive.org/web/20150125020014id_/http://dreamwardgames.com/theroomz/RoomzMain.swf'

          fetch_verified originals/recovered/dreamwardgames/UnderTR.swf \
            6e88693508b8a23edbc8c604035e59e721b19e3ac92c234d289555f57bbcdcf4 \
            'https://web.archive.org/web/20150125014523id_/http://dreamwardgames.com/theroomz/UnderTR.swf'

          fetch_verified originals/recovered/dreamwardgames-site/DreamWard_website_games.swf \
            7aa5bb44ae35ed0193a68ed72b6218ff8b27a54f3077dcad05911bd2aaca87e5 \
            'https://web.archive.org/web/20130908011142id_/http://dreamwardgames.com/DreamWard%20website%20(games).swf'

          fetch_verified originals/recovered/yoyo/RoomzMain_2007.swf \
            61c728f54f9552744edc19f22b152a7ed89854b45891316957eaeaf763d4add9 \
            'https://web.archive.org/web/20070206062346id_/http://www.theroomz.yoyo.pl/RoomzMain.swf' \
            'https://web.archive.org/web/20070206062346id_/http://theroomz.yoyo.pl/RoomzMain.swf'

          fetch_verified originals/recovered/yoyo/RoomzMain_2011.swf \
            d7dd1d01587d2857d5bb67cc7b94c0ab6f9fc18b53d66cd81f2b849606ea32e1 \
            'https://web.archive.org/web/20110930161009id_/http://www.theroomz.yoyo.pl/RoomzMain.swf' \
            'https://web.archive.org/web/20110930161009id_/http://theroomz.yoyo.pl/RoomzMain.swf'

          fetch_verified originals/recovered/yoyo/UnderTR_2011.swf \
            161aad66dfee6c219dd9fab2206e8f1f335f4ab1f29875de672057d515c128f3 \
            'https://web.archive.org/web/20110930161017id_/http://www.theroomz.yoyo.pl/UnderTR.swf' \
            'https://web.archive.org/web/20110930161017id_/http://theroomz.yoyo.pl/UnderTR.swf'

          fetch_verified originals/recovered/yoyo/RRR.swf \
            c58a2a373bcc3c1cb36b9864b4bf1932f009c8f96a457f9d4d3db3cdc5f8f4f5 \
            'https://web.archive.org/web/20121102214347id_/http://www.theroomz.yoyo.pl/RRR.swf' \
            'https://web.archive.org/web/20121102214347id_/http://theroomz.yoyo.pl/RRR.swf'

          fetch_verified originals/recovered/yoyo/data.swf \
            91657fb753d5794c5310b25ed9e6d896e67ddb199cff5d8ca7f275410360ae0b \
            'https://web.archive.org/web/20121102214348id_/http://www.theroomz.yoyo.pl/data.swf' \
            'https://web.archive.org/web/20121102214348id_/http://theroomz.yoyo.pl/data.swf'

          fetch_verified originals/recovered/demo/the-roomz-3-room-demo.swf \
            69c8e5d139d029617a5a65605e88c6103214cb1831b1ae1c4f059fb38b848967 \
            'https://web2.flashgames.it/giochi/avventura/the.roomz/game.swf'

          sha256sum \
            originals/recovered/dreamwardgames/*.swf \
            originals/recovered/dreamwardgames-site/*.swf \
            originals/recovered/yoyo/*.swf \
            originals/recovered/demo/*.swf \
            > checksums/SHA256SUMS-recovered-files.txt

      - name: Commit verified originals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'The Roomz Preservation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add originals checksums/SHA256SUMS-recovered-files.txt
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add verified recovered original files'
          git push
