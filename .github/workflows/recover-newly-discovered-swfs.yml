name: Recover newly discovered Roomz SWFs

on:
  push:
    paths:
      - '.github/workflows/recover-newly-discovered-swfs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roomz-new-swf-hunt
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Probe all historical hosts for newly discovered SWFs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          from urllib.error import HTTPError, URLError
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import csv, hashlib, json, re, time

          ROOT=Path('research/new-swf-targets')
          REC=ROOT/'recovered'
          ROOT.mkdir(parents=True,exist_ok=True); REC.mkdir(parents=True,exist_ok=True)
          UA='Mozilla/5.0 Roomz-preservation (+https://github.com/dereksparks1982/The-Roomz-Game-2007)'

          targets=[
            'paper/BlackAndWhite.swf',
            'BlackAndWhite.swf',
            'hof.swf',
            'Redirect.swf'
          ]
          bases=[
            'http://www.theroomz.yoyo.pl/', 'http://theroomz.yoyo.pl/',
            'https://www.theroomz.yoyo.pl/', 'https://theroomz.yoyo.pl/',
            'http://dreamward.home.pl/theroomz/', 'https://dreamward.home.pl/theroomz/',
            'http://dreamwardgames.com/theroomz/', 'https://dreamwardgames.com/theroomz/',
            'http://www.theroomz.org/', 'http://theroomz.org/'
          ]
          urls=[]
          for b in bases:
              for t in targets:
                  urls.append(b+t)
          # Include exact URLs exposed by recovered embed pages first.
          urls += [
            'http://www.theroomz.yoyo.pl:80/paper/BlackAndWhite.swf',
            'http://www.theroomz.yoyo.pl:80/hof.swf',
            'http://www.theroomz.yoyo.pl/Redirect.swf'
          ]
          urls=list(dict.fromkeys(urls))

          def get(url,tries=3,timeout=30):
              last=None
              for n in range(tries):
                  try:
                      with urlopen(Request(url,headers={'User-Agent':UA}),timeout=timeout) as r:
                          return r.read(),r.geturl(),dict(r.headers)
                  except (HTTPError,URLError,TimeoutError) as e:
                      last=e; time.sleep(1.2*(n+1))
              raise RuntimeError(f'{url}: {last}')

          cdx=[]; failures=[]
          def cdx_one(u):
              q='https://web.archive.org/cdx/search/cdx?'+urlencode({
                'url':u,'matchType':'exact','output':'json',
                'fl':'timestamp,original,statuscode,mimetype,digest,length',
                'collapse':'digest'
              })
              b,_,_=get(q,tries=2,timeout=25)
              return u,b

          with ThreadPoolExecutor(max_workers=10) as ex:
              futs={ex.submit(cdx_one,u):u for u in urls}
              for fut in as_completed(futs):
                  u=futs[fut]
                  try:
                      _,b=fut.result(); data=json.loads(b)
                      if isinstance(data,list) and data:
                          hdr=data[0]
                          for v in data[1:]:
                              r=dict(zip(hdr,v)); r['query_url']=u; cdx.append(r)
                  except Exception as e:
                      failures.append(['cdx',u,repr(e)])

          # Deduplicate captures, prefer status 200 but attempt every capture signature.
          caps=[]; seen=set()
          for r in sorted(cdx,key=lambda x:(x.get('original',''),x.get('timestamp',''))):
              k=(r.get('original'),r.get('timestamp'),r.get('digest'))
              if k not in seen: seen.add(k); caps.append(r)

          known={}
          for p in Path('originals/recovered').rglob('*'):
              if p.is_file():
                  try: known[hashlib.sha256(p.read_bytes()).hexdigest()]=str(p)
                  except Exception: pass

          recovered=[]
          def fetch_cap(r):
              au=f"https://web.archive.org/web/{r['timestamp']}id_/{r['original']}"
              try:
                  b,final,h=get(au,tries=3,timeout=35)
                  return r,au,b,None
              except Exception as e:
                  return r,au,None,repr(e)

          with ThreadPoolExecutor(max_workers=8) as ex:
              futs=[ex.submit(fetch_cap,r) for r in caps]
              for fut in as_completed(futs):
                  r,au,b,err=fut.result()
                  if b is None:
                      failures.append(['capture',au,err]); continue
                  sha=hashlib.sha256(b).hexdigest()
                  sig=b[:3].decode('latin1','replace')
                  is_swf=b[:3] in (b'FWS',b'CWS',b'ZWS')
                  name=Path(r.get('original','').split('?',1)[0]).name or 'object.bin'
                  safe=re.sub(r'[^A-Za-z0-9._-]+','_',name)
                  out=REC/f"{r['timestamp']}__{sha[:12]}__{safe}"
                  out.write_bytes(b)
                  recovered.append([r.get('timestamp',''),r.get('original',''),r.get('statuscode',''),r.get('mimetype',''),len(b),sha,sig,is_swf,known.get(sha,''),str(out),au])

          # Also attempt the historical live URLs. Some old hosts occasionally still serve stranded files.
          live=[]
          for u in urls:
              try:
                  b,final,h=get(u,tries=1,timeout=15)
                  sha=hashlib.sha256(b).hexdigest(); sig=b[:3].decode('latin1','replace')
                  if b[:3] in (b'FWS',b'CWS',b'ZWS'):
                      out=REC/f'LIVE__{sha[:12]}__{Path(u).name}'
                      out.write_bytes(b)
                      live.append([u,final,len(b),sha,sig,known.get(sha,''),str(out)])
              except Exception:
                  pass

          # Search all saved research text for these names and related terms.
          terms=['BlackAndWhite.swf','hof.swf','Redirect.swf','cannon.txt','yoyo.pnq','/paper/','/this/lesson.htm']
          refs=[]
          for p in Path('research').rglob('*'):
              if not p.is_file() or p.stat().st_size>3_000_000: continue
              try: text=p.read_text(encoding='utf-8',errors='replace')
              except Exception: continue
              for term in terms:
                  for m in re.finditer(re.escape(term),text,re.I):
                      a=max(0,m.start()-300); z=min(len(text),m.end()+500)
                      refs.append([term,str(p),re.sub(r'\s+',' ',text[a:z])])

          def tsv(path,header,rows):
              with path.open('w',newline='',encoding='utf-8') as f:
                  w=csv.writer(f,delimiter='\t',lineterminator='\n'); w.writerow(header); w.writerows(rows)
          tsv(ROOT/'cdx-captures.tsv',['query_url','timestamp','original','statuscode','mimetype','digest','length'],[[r.get('query_url',''),r.get('timestamp',''),r.get('original',''),r.get('statuscode',''),r.get('mimetype',''),r.get('digest',''),r.get('length','')] for r in caps])
          tsv(ROOT/'recovered.tsv',['timestamp','original','status','mime','bytes','sha256','signature','is_swf','exact_repo_match','saved_file','archive_url'],recovered)
          tsv(ROOT/'live-recovered.tsv',['requested','final','bytes','sha256','signature','exact_repo_match','saved_file'],live)
          tsv(ROOT/'local-crossreferences.tsv',['term','file','context'],refs)
          tsv(ROOT/'failures.tsv',['stage','target','error'],failures)

          valid=[r for r in recovered if r[7]]
          new=[r for r in valid if not r[8]]
          summary=['# Newly discovered SWF target hunt','',
                   f'- Candidate historical URLs tested: {len(urls)}',
                   f'- Wayback capture records found: {len(caps)}',
                   f'- Archived objects downloaded: {len(recovered)}',
                   f'- Valid archived SWFs recovered: {len(valid)}',
                   f'- Valid SWFs new vs current recovered originals: {len(new)}',
                   f'- Live stranded SWFs recovered: {len(live)}',
                   f'- Local research cross-references: {len(refs)}',
                   f'- Failures: {len(failures)}','',
                   '## New valid SWFs','']
          summary += [f'- `{r[1]}` {r[4]} bytes sha256 `{r[5]}` saved `{r[9]}`' for r in new] or ['- None recovered in this pass.']
          summary += ['', '## All capture records','']
          summary += [f"- {r.get('timestamp','')} {r.get('statuscode','')} {r.get('mimetype','')} {r.get('original','')}" for r in caps[:250]] or ['- No captures found.']
          summary += ['', '## Cross-references','']
          summary += [f'- `{r[0]}` in `{r[1]}`: {r[2][:1000]}' for r in refs[:100]]
          (ROOT/'RESULT.md').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          print('\n'.join(summary[:250]))
          PY

      - name: Commit target-hunt results safely
        shell: bash
        run: |
          git config user.name "Derek Sparks"
          git config user.email "dereksparks1982@gmail.com"
          git add research/new-swf-targets
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Hunt newly discovered Roomz SWF targets"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
